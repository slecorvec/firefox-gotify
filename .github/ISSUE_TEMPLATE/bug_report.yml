name: Bug report
description: Something does not work as the README says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Security issue? Do not file it here: use
        [a private report](https://github.com/slecorvec/firefox-gotify/security/advisories/new).
        Never paste your Gotify token or server address.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Send a message with … 2. Open the popup … 3. …"
    validations:
      required: true
  - type: input
    id: extension
    attributes:
      label: Extension version
      placeholder: "about:addons → Gotify Unread"
    validations:
      required: true
  - type: input
    id: firefox
    attributes:
      label: Firefox version and OS
      placeholder: "Firefox 146, Windows 11"
    validations:
      required: true
  - type: input
    id: gotify
    attributes:
      label: Gotify server version
      placeholder: "3.1.1"
  - type: textarea
    id: console
    attributes:
      label: Errors, if any
      description: >-
        about:debugging → This Firefox → Gotify Unread → Inspect → Console. Remove any
        token or server address first.
      render: text
