name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Extension, Firefox and Gotify server versions.
      placeholder: extension 0.2.0, Firefox 140 ESR, Gotify 2.6
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: From about:debugging → the extension → Inspect. Remove tokens and hostnames first.
      render: text
