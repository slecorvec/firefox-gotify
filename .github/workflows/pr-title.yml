# The PR title becomes the squash commit on master, and release-please builds the
# changelog from it: enforce Conventional Commits. No checkout, no token.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commits:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^ ].*[^. ]$'
          if printf '%s' "$TITLE" | grep -Eq "$re|^Revert \".+\"$"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be 'type(scope)!: summary' (Conventional Commits), got: $TITLE"
            exit 1
          fi
