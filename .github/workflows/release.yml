name: Release

# Pushing a tag vX.Y.Z (equal to src/manifest.json's version) builds the extension zip,
# attests its build provenance, publishes a GitHub release with the zip and its
# SHA-256, then, if the AMO_SIGN variable is "true", submits the same files to
# addons.mozilla.org for signing behind the "amo" environment (owner approval, AMO
# secrets). Run by hand (workflow_dispatch) for a dry run: build only.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Sigstore signature of the provenance attestation
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: version
        name: Tag matches the manifest version
        run: |
          version=$(jq -r .version src/manifest.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - name: Lint, property tests, build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run --silent lint:ext
          npm run --silent test:unit
          npm run --silent build
          mv dist/*.zip "dist/gotify-unread-$VERSION.zip"
          cd dist && sha256sum "gotify-unread-$VERSION.zip" > "gotify-unread-$VERSION.zip.sha256"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/gotify-unread-*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: dist/gotify-unread-*
          if-no-files-found: error

  github-release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension
          path: dist
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '/^## / { p = ($2 == v) ; next } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::no '## $VERSION' section in CHANGELOG.md"; exit 1; }
          cat >> notes.md <<EOT

          Unsigned build: Firefox installs it only as a temporary add-on. Install from
          addons.mozilla.org for a signed one. Verify this zip was built here from the tag:
          \`gh attestation verify gotify-unread-$VERSION.zip --repo $GITHUB_REPOSITORY\`
          EOT
        env:
          VERSION: ${{ needs.build.outputs.version }}
      - name: Create the release
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  amo:
    name: Sign on addons.mozilla.org
    if: github.ref_type == 'tag' && vars.AMO_SIGN == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment: amo # owner approval; holds AMO_JWT_ISSUER and AMO_JWT_SECRET
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Submit to AMO (listed channel)
        # web-ext reads WEB_EXT_API_KEY / WEB_EXT_API_SECRET: the secrets never reach a
        # command line. --approval-timeout 0: submit, don't wait for Mozilla's review.
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx web-ext sign --source-dir src --channel listed --approval-timeout 0
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
