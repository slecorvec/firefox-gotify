name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's minor and patch updates of npm and Docker
# dependencies: GitHub merges them once the required checks pass. Development tools
# only (src/ has no dependency), run in a CI without secrets. GitHub Actions updates
# (code that runs with write tokens, e.g. in the release) and major updates are left
# for the owner to review.
on: pull_request

permissions: {}

jobs:
  automerge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]' && github.repository == 'slecorvec/firefox-gotify'
    runs-on: ubuntu-latest
    permissions:
      contents: write # required by "gh pr merge --auto"
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - if: >-
          steps.meta.outputs.package-ecosystem != 'github_actions' &&
          steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
