<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gotify</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="popup">
  <header>
    <span id="summary">Gotify</span>
    <span class="actions">
      <button id="clear" type="button" hidden>Delete all</button>
      <a id="open" href="#">Open Gotify</a>
    </span>
  </header>
  <div id="confirm" role="alertdialog" aria-labelledby="confirm-text" hidden>
    <span id="confirm-text"></span>
    <button id="confirm-yes" type="button">Delete</button>
    <button id="confirm-no" type="button">Cancel</button>
  </div>
  <select id="app" aria-label="Filter by application" hidden></select>
  <p id="status" role="status"></p>
  <ul id="list"></ul>
  <script src="gotify.js"></script>
  <script src="popup.js"></script>
</body>
</html>
